<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDURATE | Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #f1c40f;
            --accent-glow: rgba(241, 196, 15, 0.6);
            --royal-btn: linear-gradient(135deg, #4834d4, #686de0);
            --royal-hover: linear-gradient(135deg, #3c2bb5, #5a60c1);
            --input-bg: #e0e5ec;
            --shadow-dark: #a3b1c6;
            --shadow-light: #ffffff;
            --trans-speed: 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: url('campus.jpeg') no-repeat center center fixed;
            background-size: cover; background-color: #0f172a;
            height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .orb { position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0; animation: floatOrbs 10s infinite alternate ease-in-out; opacity: 0.6; }
        .orb-1 { width: 400px; height: 400px; background: rgba(72, 52, 212, 0.5); top: -100px; left: -100px; animation-delay: 0s; }
        .orb-2 { width: 350px; height: 350px; background: rgba(241, 196, 15, 0.3); bottom: -50px; right: -50px; animation-delay: 2s; }
        @keyframes floatOrbs { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(50px, 30px) scale(1.1); } 100% { transform: translate(-30px, 50px) scale(0.9); } }

        .page-transition-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
            z-index: 9999; opacity: 1; pointer-events: none; transition: opacity 0.6s ease-in-out; 
        }

        .master-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-top: 1px solid rgba(255, 255, 255, 0.3); border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px; padding: 40px 45px; width: 100%; max-width: 420px; text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255,255,255,0.05);
            color: #fff; position: relative; z-index: 10;
        }
        
        .master-card::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: inherit; background: inherit;
            backdrop-filter: blur(5px) saturate(200%); -webkit-backdrop-filter: blur(15px) saturate(200%);
            z-index: -1; opacity: 0; 
            animation: gradualBlur 1.5s ease-in-out forwards; animation-delay: 0.5s;
        }
        @keyframes gradualBlur { from { opacity: 0; } to { opacity: 1; } }

        .stagger-item { opacity: 0; transform: translateY(30px); animation: staggerFadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes staggerFadeIn { to { opacity: 1; transform: translateY(0); } }
        .delay-1 { animation-delay: 0.2s; } .delay-2 { animation-delay: 0.4s; } .delay-3 { animation-delay: 0.6s; } .delay-4 { animation-delay: 0.8s; } .delay-5 { animation-delay: 1.0s; } .delay-6 { animation-delay: 1.2s; }

        .logo-img { max-width: 150px; height: auto; margin-bottom: 15px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); animation: floatLogo 4s ease-in-out infinite; }
        @keyframes floatLogo { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-6px) scale(1.02); filter: drop-shadow(0 15px 20px rgba(0,0,0,0.6)); } }
        
        .subtitle-container { display: flex; justify-content: center; align-items: center; height: 24px; margin-bottom: 25px; }
        .subtitle { color: var(--accent); font-size: 14.5px; font-weight: 600; letter-spacing: 0.5px; text-shadow: 0 2px 10px var(--accent-glow); }
        .cursor { display: inline-block; width: 3px; height: 16px; background-color: var(--accent); margin-left: 3px; animation: blink 0.7s infinite; box-shadow: 0 0 8px var(--accent-glow); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .role-selector { display: flex; align-items: center; justify-content: space-between; background: rgba(0, 0, 0, 0.3); padding: 8px 18px; border-radius: 14px; margin-bottom: 18px; border: 1px solid rgba(255,255,255,0.05); box-shadow: inset 3px 3px 8px rgba(0,0,0,0.5); transition: var(--trans-speed); }
        .role-selector:hover { background: rgba(0, 0, 0, 0.4); }
        select { background: #fff; border: none; padding: 5px 12px; border-radius: 8px; font-weight: 700; outline: none; cursor: pointer; font-size: 13.5px; color: #1e293b; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        select:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(241, 196, 15, 0.3); }

        .input-group { margin-bottom: 18px; position: relative; }
        input { width: 100%; padding: 14px 20px; border-radius: 14px; border: 2px solid transparent; background: var(--input-bg); outline: none; font-size: 14.5px; font-weight: 600; color: #1e293b; box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        input::placeholder { color: #94a3b8; font-weight: 500; font-size: 13.5px; transition: 0.3s; }
        input:focus { background: #ffffff; border: 2px solid rgba(104, 109, 224, 0.6); box-shadow: 0 0 20px rgba(104, 109, 224, 0.4), inset 2px 2px 5px var(--shadow-dark); transform: translateY(-3px); }
        input:focus::placeholder { opacity: 0; transform: translateX(10px); }

        .eye-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; opacity: 0.6; display: flex; align-items: center; transition: 0.3s; color: #1e293b; }
        .eye-icon:hover { opacity: 1; color: var(--accent); transform: translateY(-50%) scale(1.1); }
        .eye-icon svg { width: 18px; height: 18px; }

        .forgot-pass { display: block; text-align: right; font-size: 12.5px; font-weight: 600; color: #cbd5e1; margin-top: -8px; margin-bottom: 15px; text-decoration: none; transition: all 0.3s ease; cursor: pointer;}
        .forgot-pass:hover { color: var(--accent); text-shadow: 0 0 8px var(--accent-glow); transform: translateX(-2px); }

        .login-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--royal-btn); background-size: 200% auto; color: #fff; font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; box-shadow: 0 10px 20px rgba(72, 52, 212, 0.4), 0 6px 0px #2c1a9e, inset 0 2px 0 rgba(255,255,255,0.2); position: relative; top: 0; overflow: hidden; transition: all 0.3s ease; }
        .login-btn:hover { background-position: right center; transform: translateY(-3px); box-shadow: 0 15px 30px rgba(72, 52, 212, 0.6), 0 8px 0px #2c1a9e, inset 0 2px 0 rgba(255,255,255,0.4); }
        .login-btn:active { top: 6px; transform: translateY(0); box-shadow: 0 0px 0px #2c1a9e, inset 4px 4px 10px rgba(0,0,0,0.5); background: var(--royal-hover); filter: brightness(0.9); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .ripple { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.5); transform: scale(0); animation: ripple-animation 0.6s linear; pointer-events: none; }
        @keyframes ripple-animation { to { transform: scale(4); opacity: 0; } }

        .register-link { margin-top: 25px; font-size: 13.5px; opacity: 0.9; }
        .register-link a { color: var(--accent); text-decoration: none; font-weight: 800; position: relative; padding-bottom: 3px; cursor: pointer; transition: 0.3s; }
        .register-link a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--accent); transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1); box-shadow: 0 0 8px var(--accent-glow); }
        .register-link a:hover { text-shadow: 0 0 10px var(--accent-glow); }
        .register-link a:hover::after { width: 100%; }

        #toast { position: fixed; bottom: 30px; right: 30px; color: #fff; padding: 14px 24px; border-radius: 12px; font-weight: 600; font-size: 14.5px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); opacity: 0; transform: translateY(20px); transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: none; z-index: 9999; }
        #toast.show { opacity: 1; transform: translateY(0); }

        /* 🚀 NEW: Forgot Password Modal Styling */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000; opacity: 0; pointer-events: none; transition: 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .reset-card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px 40px; border-radius: 20px; width: 90%; max-width: 400px;
            text-align: center; color: #fff; transform: translateY(30px) scale(0.95); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal-overlay.active .reset-card { transform: translateY(0) scale(1); }
        .reset-card h2 { font-size: 20px; color: var(--accent); margin-bottom: 10px; }
        .reset-card p { font-size: 13px; opacity: 0.8; margin-bottom: 20px; line-height: 1.5; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #fff; opacity: 0.6; transition: 0.3s; }
        .close-modal:hover { opacity: 1; color: var(--danger, #e74c3c); transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="page-transition-overlay" id="overlay"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="master-card" id="mainCard">
        <div class="stagger-item delay-1">
            <img src="logo.png" alt="EduRate Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
        
        <div class="subtitle-container stagger-item delay-2">
            <span class="subtitle" id="typewriter-text"></span><span class="cursor"></span>
        </div>

        <div class="role-selector stagger-item delay-3">
            <span style="font-weight: 600; font-size: 14px;">Login as:</span>
            <select id="role-select" onchange="toggleLoginLayout()">
                <option value="Student">Student</option>
                <option value="Teacher">Teacher</option>
                <option value="Admin">Admin</option>
            </select>
        </div>

        <div class="input-group stagger-item delay-4">
            <input type="text" id="id-input" placeholder="Student ID" required>
        </div>
        
        <div class="input-group stagger-item delay-5">
            <input type="password" id="password-input" placeholder="Password" required>
            <span class="eye-icon" onclick="togglePass('password-input', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
        </div>

        <div class="stagger-item delay-5">
            <a onclick="openResetModal()" class="forgot-pass">Forgot password?</a>
        </div>

        <div class="stagger-item delay-6">
            <button class="login-btn" id="loginBtn">Sign In</button>
        </div>
        
        <div class="stagger-item delay-6">
            <p class="register-link">New here? <a onclick="pageTransition('registration.html')">Create account</a></p>
        </div>
    </div>

    <!-- 🚀 NEW: Forgot Password Modal HTML -->
    <div class="modal-overlay" id="resetModal">
        <div class="reset-card">
            <span class="close-modal" onclick="closeResetModal()">×</span>
            <h2>Reset Password</h2>
            <p>Enter your registered ID or Email address. We will send a secure link to reset your password.</p>
            <div class="input-group">
                <input type="text" id="reset-email" placeholder="Enter ID or Email..." required>
            </div>
            <button class="login-btn" id="resetBtn" onclick="handlePasswordReset()">Send Reset Link</button>
        </div>
    </div>

    <div id="toast">Message goes here</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBj4d6Bcpwe6UYZIqmuhCW_HHzQmpm8bYY",
            authDomain: "edurate-74300.firebaseapp.com",
            projectId: "edurate-74300",
            storageBucket: "edurate-74300.firebasestorage.app",
            messagingSenderId: "616936292339",
            appId: "1:616936292339:web:61a50822fad7e71b6f1c86",
            measurementId: "G-JDF60JSMQT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- 🚀 NEW: Forgot Password Logic ---
        window.openResetModal = () => {
            document.getElementById('resetModal').classList.add('active');
            // Auto-fill if ID was already typed in login screen
            const currentInput = document.getElementById('id-input').value;
            if(currentInput) document.getElementById('reset-email').value = currentInput;
        };

        window.closeResetModal = () => {
            document.getElementById('resetModal').classList.remove('active');
            document.getElementById('reset-email').value = '';
        };

        window.handlePasswordReset = async () => {
            const resetInput = document.getElementById('reset-email').value.trim();
            const resetBtn = document.getElementById('resetBtn');

            if (!resetInput) {
                showToast("⚠ Please enter your ID or Email.", true);
                return;
            }

            resetBtn.disabled = true;
            resetBtn.innerText = "Sending...";

            // Format as email if it's just an ID
            const targetEmail = resetInput.includes('@') ? resetInput : `${resetInput.toLowerCase()}@edurate.com`;

            try {
                await sendPasswordResetEmail(auth, targetEmail);
                showToast("📧 Password reset link sent to your email!");
                setTimeout(() => {
                    closeResetModal();
                    resetBtn.disabled = false;
                    resetBtn.innerText = "Send Reset Link";
                }, 2000);
            } catch (error) {
                console.error("Reset Error:", error);
                let errorMsg = "Failed to send reset link.";
                if (error.code === 'auth/invalid-email') errorMsg = "Invalid Email format!";
                if (error.code === 'auth/user-not-found') errorMsg = "No account found with this ID!";
                
                showToast(`❌ ${errorMsg}`, true);
                resetBtn.disabled = false;
                resetBtn.innerText = "Send Reset Link";
            }
        };

        // --- LOGIN LOGIC ---
        window.handleFirebaseLogin = async (event) => {
            createRipple(event);

            const userId = document.getElementById('id-input').value.trim();
            const password = document.getElementById('password-input').value;
            const selectedRole = document.getElementById('role-select').value.toLowerCase();
            const loginBtn = document.getElementById('loginBtn');

            if(!userId || !password) {
                showToast("⚠ Please enter your ID and Password.", true);
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerText = "Connecting...";

            let loginEmail = userId.includes('@') ? userId : `${userId.toLowerCase()}@edurate.com`;
            
            if (selectedRole === 'admin' && userId === '2424675102') {
                loginEmail = "mrchowdhury.raihan@gmail.com";
            }

            try {
                let userCredential;
                try {
                    userCredential = await signInWithEmailAndPassword(auth, loginEmail, password);
                } catch (authError) {
                    if (loginEmail === "mrchowdhury.raihan@gmail.com") {
                        try {
                            userCredential = await createUserWithEmailAndPassword(auth, loginEmail, password);
                            
                            await setDoc(doc(db, "users", userCredential.user.uid), {
                                fullName: "RAIHAN CHOWDHURY",
                                role: "admin",
                                adminLevel: "super", 
                                realEmail: "mrchowdhury.raihan@gmail.com",
                                studentId: "2424675102",
                                contact: "01786718889",
                                status: "approved"
                            });
                            showToast("👑 Super Admin Initialized!", false);
                        } catch (createError) {
                            if (createError.code === 'auth/email-already-in-use') {
                                throw new Error("Incorrect Password for Super Admin!");
                            } else {
                                throw createError;
                            }
                        }
                    } else {
                        throw authError; 
                    }
                }

                const user = userCredential.user;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                
                let userData, dbRole, status;

                if (!userDoc.exists()) {
                    await auth.signOut();
                    throw new Error("User profile not found in database!");
                }
                
                userData = userDoc.data();
                dbRole = (userData.role || "").toLowerCase();
                status = userData.status || "approved";

                if (status === "pending") {
                    await auth.signOut();
                    throw new Error("Your account is pending Admin approval. Please wait.");
                } else if (status === "suspended") {
                    await auth.signOut();
                    throw new Error("Your account is currently suspended.");
                }

                if (selectedRole !== dbRole) {
                    await auth.signOut();
                    throw new Error(`You are registered as a ${dbRole.toUpperCase()}, not a ${selectedRole.toUpperCase()}!`);
                }

                localStorage.setItem('userRole', dbRole);
                localStorage.setItem('userEmail', userData.realEmail || userData.email || loginEmail);
                localStorage.setItem('userName', userData.fullName);
                localStorage.setItem('studentId', userData.studentId || userData.staffId || userId);

                showToast(`✅ Welcome, ${userData.fullName}!`);
                
                setTimeout(() => {
                    if (loginEmail === "mrchowdhury.raihan@gmail.com") {
                        pageTransition('super.html');
                    } else {
                        pageTransition('dashboard.html');
                    }
                }, 1500);

            } catch (error) {
                console.error(error);
                let errorMsg = error.message;
                
                if(error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMsg = "Invalid ID or Password!";
                }

                showToast(`❌ ${errorMsg}`, true);
                loginBtn.disabled = false;
                loginBtn.innerText = "Sign In";
            }
        };

        document.getElementById('loginBtn').addEventListener('click', handleFirebaseLogin);

        window.addEventListener('load', () => {
            const overlay = document.getElementById('overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 600);
        });

        window.pageTransition = (url) => {
            const overlay = document.getElementById('overlay');
            const card = document.getElementById('mainCard');
            card.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            card.style.transform = 'scale(0.95) translateY(-30px)';
            card.style.opacity = '0';
            overlay.style.display = 'block';
            setTimeout(() => { overlay.style.opacity = '1'; }, 50);
            setTimeout(() => { window.location.href = url; }, 550);
        }

        window.togglePass = (id, btn) => {
            const el = document.getElementById(id);
            const openEye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
            const closedEye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
            if (el.type === "password") { el.type = "text"; btn.innerHTML = closedEye; } 
            else { el.type = "password"; btn.innerHTML = openEye; }
        }

        window.toggleLoginLayout = () => {
            const role = document.getElementById('role-select').value;
            const idInput = document.getElementById('id-input');
            idInput.style.opacity = 0;
            setTimeout(() => {
                if(role === 'Student') idInput.placeholder = "Student ID";
                else if(role === 'Teacher') idInput.placeholder = "Staff ID";
                else idInput.placeholder = "Admin ID";
                idInput.style.opacity = 1;
            }, 200);
        }
        toggleLoginLayout();

        function createRipple(event) {
            const button = event.currentTarget;
            const circle = document.createElement("span");
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            const rect = button.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add("ripple");
            const existingRipple = button.querySelector('.ripple');
            if (existingRipple) { existingRipple.remove(); }
            button.appendChild(circle);
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.background = isError ? '#e74c3c' : '#2ecc71';
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // 🚀 টাইপরাইটার এনিমেশন
        const text = "Rate Your Teacher Smartly!";
        const typeSpeed = 80;
        const eraseSpeed = 40;
        const pauseEnd = 3000;
        const pauseStart = 600;

        let i = 0;
        let isDeleting = false;
        const textElement = document.getElementById("typewriter-text");

        function typeWriter() {
            const currentText = text.substring(0, i);
            textElement.innerHTML = currentText;

            if (!isDeleting && i < text.length) {
                i++;
                setTimeout(typeWriter, typeSpeed);
            } else if (isDeleting && i > 0) {
                i--;
                setTimeout(typeWriter, eraseSpeed);
            } else if (i === text.length) {
                isDeleting = true;
                setTimeout(typeWriter, pauseEnd);
            } else if (i === 0 && isDeleting) {
                isDeleting = false;
                setTimeout(typeWriter, pauseStart);
            }
        }

        setTimeout(typeWriter, 1200);
    </script>
</body>
</html>
