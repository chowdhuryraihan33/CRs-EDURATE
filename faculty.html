<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDURATE | Faculty Members</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: background 0.3s, color 0.3s; }
        :root { --bg: #e0e5ec; --text: #2c3e50; --shadow-light: #ffffff; --shadow-dark: #a3b1c6; --accent: #3498db; --sidebar-bg: #e0e5ec; --sidebar-w: 280px; --danger: #e74c3c;}
        .dark-mode { --bg: #2d3436; --text: #dfe6e9; --shadow-light: #3d4446; --shadow-dark: #1e2223; --accent: #f1c40f; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--bg); height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.1); transition: transform 0.4s ease; z-index: 1000; }
        .logo-3d { font-size: 32px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 50px; text-align: center; text-shadow: 2px 2px 0px var(--shadow-light), 4px 4px 0px var(--shadow-dark); }
        
        .nav-menu { list-style: none; flex-grow: 1; display: flex; flex-direction: column; gap: 5px; }
        .nav-menu li { padding: 15px 20px; margin-bottom: 10px; border-radius: 15px; cursor: pointer; color: var(--text); font-weight: 600; display: flex; align-items: center; gap: 12px; box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); }
        .nav-menu li:hover, .nav-menu li.active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: var(--accent); }
        
        .logout-item { margin-top: auto !important; margin-bottom: 0 !important; color: var(--danger) !important; }

        .main-content { flex: 1; padding: 30px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; width: 100%; position: relative; }
        .top-icons { width: 100%; max-width: 1100px; display: flex; justify-content: flex-end; gap: 20px; margin-bottom: 25px; align-items: center; }
        
        .hamburger { display: none; margin-right: auto; cursor: pointer; color: var(--text); }
        .hamburger svg { width: 30px; height: 30px; }

        .icon-btn { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light); background: var(--bg); position: relative;}
        .icon-btn:active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); transform: scale(0.95); }

        .page-title-3d { font-size: 20px; font-weight: 800; color: #fff; background: var(--accent); padding: 10px 35px; border-radius: 15px; box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); margin-bottom: 25px; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .dark-mode .page-title-3d { background: #fff; color: #2c3e50; text-shadow: none; }

        .teacher-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; width: 100%; max-width: 1100px; }
        .teacher-card { background: var(--bg); padding: 20px 15px; border-radius: 20px; text-align: center; box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between;}
        .teacher-card:hover { transform: translateY(-3px); }
        
        .prof-circle { width: 60px; height: 60px; background: var(--bg); border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 20px; font-weight: 800; box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); }
        
        .teacher-card h3 { font-size: 14px; margin-bottom: 2px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rating-text { font-size: 11px; font-weight: 700; color: var(--success); margin-bottom: 8px; display: block; }
        .course-badge { font-size: 10px; font-weight: 600; color: var(--text); background: rgba(52, 152, 219, 0.1); padding: 4px 10px; border-radius: 15px; display: inline-block; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%;}
        
        .view-profile { display: inline-block; margin-top: auto; font-size: 11px; font-weight: 700; color: var(--accent); text-decoration: none; border-bottom: 2px solid transparent; transition: 0.3s; cursor: pointer; padding-bottom: 2px;}
        .view-profile:hover { border-bottom: 2px solid var(--accent); }
        
        .empty-state { text-align: center; width: 100%; grid-column: 1 / -1; opacity: 0.5; font-weight: 600; margin-top: 50px; }

        .notif-dropdown { display: none; position: absolute; top: 60px; right: 0; width: 340px; max-height: 400px; overflow-y: auto; background: var(--bg); padding: 20px; border-radius: 20px; box-shadow: 10px 10px 30px rgba(0,0,0,0.2), inset 2px 2px 5px var(--shadow-light); z-index: 1000; text-align: left; }
        .notif-dropdown.show { display: block; }
        .notif-item { padding: 12px 10px; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; }
        .notif-date { font-size: 11px; opacity: 0.6; display: block; margin-bottom: 4px; color: var(--accent); font-weight: 800;}
        .badge { display: none; position: absolute; top: 12px; right: 14px; width: 10px; height: 10px; background: var(--danger); border-radius: 50%; }

        #toast { position: fixed; bottom: 30px; right: 30px; color: #fff; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); opacity: 0; transform: translateY(20px); transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: none; z-index: 9999; }
        #toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); box-shadow: 10px 0 20px rgba(0,0,0,0.3); }
            .sidebar.open { transform: translateX(0); }
            .hamburger { display: block; }
            .top-icons { justify-content: space-between; margin-bottom: 15px; }
            .main-content { padding: 15px; }
            .teacher-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
            .teacher-card { padding: 15px 10px; border-radius: 15px; }
            .prof-circle { width: 50px; height: 50px; font-size: 16px; }
            .teacher-card h3 { font-size: 13px; }
            .course-badge { font-size: 9px; padding: 3px 8px;}
            .notif-dropdown { right: -50px; width: 280px; }
        }
    </style>
</head>
<body id="body">

    <div id="authOverlay" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 99999; flex-direction: column; align-items:center; justify-content:center;">
        <h1 style="color: var(--danger); font-size: 30px; font-weight: 800;">Access Denied! 🚫</h1>
        <p id="authMessage" style="margin-top: 10px; font-weight: 600;">Only Administrators can view this panel.</p>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="logo-3d">EDURATE</div>
        <ul class="nav-menu">
            <li onclick="location.href='dashboard.html'">🏠 Dashboard</li>
            <li class="student-only" onclick="location.href='evaluation.html'">📊 Evaluation</li>
            <li class="active" onclick="location.href='faculty.html'">👨‍🏫 Faculty Members</li>
            <li onclick="location.href='profile.html'">👤 My Profile</li>
            <li onclick="location.href='setting.html'">⚙️ Setting</li>
            <li class="admin-only" style="display:none;" onclick="location.href='admin.html'">🔐 Admin Panel</li>
            <li class="logout-item" id="logoutBtn">🚪 Log out</li>
        </ul>
    </div>

    <div class="main-content">
        <div class="top-icons">
            <div class="hamburger" id="hamburgerBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </div>
            <div style="display: flex; gap: 20px; position: relative;">
                <div class="icon-btn" id="theme-toggle">🌙</div>
                <div class="icon-btn" id="notifBtn">
                    🔔<span class="badge" id="notifBadge"></span>
                </div>
                <div class="notif-dropdown" id="notifDropdown">
                    <h4 style="margin-bottom:10px; padding-bottom:10px; border-bottom:2px solid rgba(0,0,0,0.05);">Notifications</h4>
                    <div id="notifList">Loading notifications...</div>
                </div>
            </div>
        </div>

        <div class="page-title-3d">Faculty Members</div>
        
        <div class="teacher-grid" id="dynamicTeacherGrid"></div>
    </div>

    <div id="toast">Message goes here</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBj4d6Bcpwe6UYZIqmuhCW_HHzQmpm8bYY",
        authDomain: "edurate-74300.firebaseapp.com",
        projectId: "edurate-74300",
        storageBucket: "edurate-74300.firebasestorage.app",
        messagingSenderId: "616936292339",
        appId: "1:616936292339:web:61a50822fad7e71b6f1c86",
        measurementId: "G-JDF60JSMQT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const rawRole = localStorage.getItem('userRole') || 'student';
    const userRole = String(rawRole).trim().toLowerCase();
    const currentUserEmail = localStorage.getItem('userEmail') || '';
    const currentUserId = localStorage.getItem('studentId') || ''; 

    // ১. সাইডবার মেনু সিকিউরিটি
    document.querySelectorAll('.student-only').forEach(el => {
        el.style.display = (userRole === 'student') ? 'flex' : 'none';
    });
    document.querySelectorAll('.admin-only').forEach(el => {
        el.style.display = (userRole === 'admin') ? 'flex' : 'none';
    });

    // ২. 🚀 100% REAL-TIME DATA FETCHING (Faculty + Ratings)
    const gridContainer = document.getElementById('dynamicTeacherGrid');
    
    let allFaculty = [];
    let allRatings = [];

    const renderFacultyGrid = () => {
        gridContainer.innerHTML = '';
        if (allFaculty.length === 0) {
            gridContainer.innerHTML = '<div class="empty-state">No faculty members found. Please ask an admin to add them.</div>';
            return;
        }

        allFaculty.forEach((teacher) => {
            const teacherRatings = allRatings.filter(r => r.teacherShortName === teacher.shortName);
            const avgRating = teacherRatings.length > 0 
                ? (teacherRatings.reduce((sum, r) => sum + parseFloat(r.rating), 0) / teacherRatings.length).toFixed(1)
                : "0.0";

            let profileLinkHtml = '';
            
            // Access control for "View Profile"
            if (userRole === 'admin') {
                profileLinkHtml = `<a onclick="viewProfile('${teacher.fullName}', '${teacher.shortName}', '${teacher.dept}', '${teacher.email}', '${avgRating}', '${teacher.staffId || 'N/A'}', '${teacher.phone || 'N/A'}')" class="view-profile">View Full Profile →</a>`;
            } 
            else if (userRole === 'teacher' && teacher.staffId === currentUserId) {
                profileLinkHtml = `<a onclick="viewProfile('${teacher.fullName}', '${teacher.shortName}', '${teacher.dept}', '${teacher.email}', '${avgRating}', '${teacher.staffId || 'N/A'}', '${teacher.phone || 'N/A'}')" class="view-profile">View Full Profile →</a>`;
            }

            // কার্ড তৈরি
            gridContainer.innerHTML += `
                <div class="teacher-card">
                    <div>
                        <div class="prof-circle">${teacher.shortName}</div>
                        <h3>${teacher.fullName}</h3>
                        <span class="rating-text">⭐ ${avgRating} / 5.0 Avg</span>
                        <span class="course-badge">${teacher.dept}</span>
                    </div>
                    ${profileLinkHtml}
                </div>
            `;
        });
    };

    // Listen to Faculty changes (Added/Removed/Edited)
    onSnapshot(collection(db, "faculty"), (snapshot) => {
        allFaculty = snapshot.docs.map(doc => doc.data());
        renderFacultyGrid();
    });

    // Listen to Ratings changes (Live Avg Score update)
    onSnapshot(collection(db, "ratings"), (snapshot) => {
        allRatings = snapshot.docs.map(doc => doc.data());
        renderFacultyGrid();
    });

    // ৩. প্রোফাইল দেখার ফাংশন
    window.viewProfile = (name, short, dept, email, rating, staffId, phone) => {
        if (userRole === 'student') {
            showToast("🚫 Access Denied! Students cannot view full profiles.", true);
            return;
        }
        if (userRole === 'teacher' && email !== currentUserEmail) {
            showToast("🚫 Access Denied! You can only view your own profile.", true);
            return;
        }
        const url = `teacher-profile.html?name=${encodeURIComponent(name)}&short=${encodeURIComponent(short)}&dept=${encodeURIComponent(dept)}&email=${encodeURIComponent(email)}&rating=${rating}&staffId=${encodeURIComponent(staffId)}&phone=${encodeURIComponent(phone)}`;
        window.location.href = url;
    };

    // --- থিম, সাইডবার ও টোস্ট লজিক ---
    window.showToast = (message, isError = false) => {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    };

    const themeToggle = document.getElementById('theme-toggle');
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        themeToggle.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'index.html';
    });

    document.getElementById('hamburgerBtn').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
    });
     
    // 🚀 CLOSE SIDEBAR ON OUTSIDE CLICK (MOBILE VIEW FIX)
        document.addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebar');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            
            // Check if the sidebar is open and the click happened outside the sidebar and hamburger button
            if (sidebar && hamburgerBtn && sidebar.classList.contains('open')) {
                if (!sidebar.contains(e.target) && !hamburgerBtn.contains(e.target)) {
                    sidebar.classList.remove('open');
                }
            }
        });

    // ==========================================
    // GLOBAL REAL-TIME NOTIFICATION SYSTEM (WITH SEEN TRACKING)
    // ==========================================
    (function() {
        const notifBtn = document.getElementById('notifBtn');
        const notifDropdown = document.getElementById('notifDropdown');
        const notifBadge = document.getElementById('notifBadge');
        const notifList = document.getElementById('notifList');
        
        let currentMaxTimestamp = 0; 

        if (notifBtn && notifDropdown) {
            notifBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                notifDropdown.classList.toggle('show');
                if (notifBadge) notifBadge.style.display = 'none'; 
                
                if (currentMaxTimestamp > 0) {
                    localStorage.setItem('lastSeenNotifTime', currentMaxTimestamp.toString());
                }
            });

            document.addEventListener('click', (e) => {
                if (!notifBtn.contains(e.target) && !notifDropdown.contains(e.target)) {
                    notifDropdown.classList.remove('show');
                }
            });
        }
        
        if (notifList && typeof db !== 'undefined') {
            onSnapshot(collection(db, "notifications"), (snapshot) => {
                if (snapshot.empty) {
                    notifList.innerHTML = '<div style="opacity:0.5; padding:10px; text-align:center;">No new notifications</div>';
                    return;
                }

                let notifsArray = [];
                currentMaxTimestamp = 0; 

                snapshot.forEach(doc => {
                    const data = doc.data();
                    notifsArray.push(data);
                    
                    if (data.timestamp > currentMaxTimestamp) {
                        currentMaxTimestamp = data.timestamp;
                    }
                });
                
                notifsArray.sort((a, b) => b.timestamp - a.timestamp);

                notifList.innerHTML = '';
                notifsArray.forEach(n => {
                    notifList.innerHTML += `
                        <div class="notif-item">
                            <span class="notif-date">${n.date}</span>
                            ${n.text}
                        </div>`;
                });
                
                const lastSeen = parseInt(localStorage.getItem('lastSeenNotifTime')) || 0;

                if (currentMaxTimestamp > lastSeen && notifBadge && notifDropdown && !notifDropdown.classList.contains('show')) {
                    notifBadge.style.display = 'block'; 
                } else if (notifBadge) {
                    notifBadge.style.display = 'none'; 
                }
            }, (error) => {
                console.error("Error loading notifications: ", error);
            });
        }
    })();
</script>
</body>
</html>
