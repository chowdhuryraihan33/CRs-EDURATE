<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDURATE | My Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: 0.3s; }
        :root { --bg: #e0e5ec; --text: #2c3e50; --shadow-light: #ffffff; --shadow-dark: #a3b1c6; --accent: #3498db; --sidebar-w: 280px; --danger: #e74c3c; --success: #2ecc71;}
        .dark-mode { --bg: #2d3436; --text: #dfe6e9; --shadow-light: #3d4446; --shadow-dark: #1e2223; --accent: #f1c40f; }
        
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--bg); height: 100vh; padding: 40px 20px; border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; transition: transform 0.4s ease; z-index: 1000;}
        .logo-3d { font-size: 32px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 50px; text-align: center; text-shadow: 2px 2px 0px var(--shadow-light), 4px 4px 0px var(--shadow-dark); }
        .nav-menu { list-style: none; flex-grow: 1; display: flex; flex-direction: column; gap: 5px; }
        .nav-menu li { padding: 15px 20px; margin-bottom: 10px; border-radius: 15px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 12px; box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); color: var(--text);}
        .nav-menu li:hover, .nav-menu li.active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: var(--accent); }
        
        /* 🚀 Logout Fix */
        .logout-item { margin-top: auto !important; margin-bottom: 0 !important; color: var(--danger) !important; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }

        /* 🚀 Matches Dashboard EXACTLY */
        .top-icons { width: 100%; max-width: 1100px; display: flex; justify-content: flex-end; gap: 20px; margin-bottom: 25px; align-items: center; }
        .hamburger { display: none; margin-right: auto; cursor: pointer; color: var(--text); } 
        .hamburger svg { width: 30px; height: 30px; }
        
        .icon-btn { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; background: var(--bg); box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light); position: relative;}
        .icon-btn:active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); transform: scale(0.95); }

        .profile-card { width: 100%; max-width: 850px; background: var(--bg); padding: 40px; border-radius: 35px; box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light); }
        .profile-header { display: flex; align-items: center; gap: 30px; margin-bottom: 40px; border-bottom: 2px solid rgba(0,0,0,0.05); padding-bottom: 30px; }
        .avatar-circle { width: 110px; height: 110px; background: var(--bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 50px; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); border: 4px solid var(--bg); }
        .header-info h1 { font-size: 28px; font-weight: 800; }
        .header-info p { font-weight: 600; color: var(--accent); opacity: 0.8; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .input-group { text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: 800; opacity: 0.6; margin-bottom: 8px; text-transform: uppercase; }
        .input-field { width: 100%; padding: 15px; border-radius: 15px; border: none; background: var(--bg); box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); outline: none; font-size: 15px; font-weight: 600; color: var(--text); }
        .field-fixed { opacity: 0.7; cursor: not-allowed; background: rgba(0,0,0,0.02); }

        .action-area { margin-top: 40px; display: flex; justify-content: space-between; align-items: center; }
        .edit-btn { padding: 12px 30px; border-radius: 12px; border: none; background: var(--bg); box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); font-weight: 700; color: var(--accent); cursor: pointer; display: flex; align-items: center; gap: 10px;}
        .edit-btn:active { box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); transform: scale(0.97); }
        .save-mode { background: var(--accent) !important; color: white !important; }
        .semester-row { display: flex; gap: 15px; }

        /* 🚀 Polished Notification Dropdown */
        .notif-dropdown { display: none; position: absolute; top: 60px; right: 0; width: 340px; max-height: 400px; overflow-y: auto; background: var(--bg); padding: 20px; border-radius: 20px; box-shadow: 10px 10px 30px rgba(0,0,0,0.2), inset 2px 2px 5px var(--shadow-light); z-index: 1000; text-align: left; }
        .notif-dropdown.show { display: block; }
        .notif-item { padding: 12px 10px; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4;}
        .notif-date { font-size: 11px; opacity: 0.6; display: block; margin-bottom: 4px; color: var(--accent); font-weight: 800;}
        .badge { display: none; position: absolute; top: 12px; right: 14px; width: 10px; height: 10px; background: var(--danger); border-radius: 50%; }

        #toast { position: fixed; bottom: 30px; right: 30px; color: #fff; padding: 14px 24px; border-radius: 12px; font-weight: 600; font-size: 14.5px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); opacity: 0; transform: translateY(20px); transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: none; z-index: 9999; }
        #toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); box-shadow: 10px 0 20px rgba(0,0,0,0.3); }
            .sidebar.open { transform: translateX(0); }
            .main-content { padding: 15px; }
            .top-icons { justify-content: space-between; margin-bottom: 15px; }
            .hamburger { display: block; }
            .profile-card { padding: 25px 15px; border-radius: 25px; }
            .profile-header { flex-direction: column; text-align: center; gap: 15px; padding-bottom: 20px; }
            .info-grid { grid-template-columns: 1fr; gap: 15px; } 
            .semester-row { flex-direction: column; gap: 15px; } 
            .action-area { flex-direction: column; gap: 20px; text-align: center; }
            .edit-btn { width: 100%; justify-content: center; }
            .notif-dropdown { right: -50px; width: 280px;}
        }
    </style>
</head>
<body id="body">

    <div class="sidebar" id="sidebar">
        <div class="logo-3d">EDURATE</div>
        <ul class="nav-menu">
            <li onclick="location.href='dashboard.html'">🏠 Dashboard</li>
            <li class="student-only" onclick="location.href='evaluation.html'">📊 Evaluation</li>
            <li onclick="location.href='faculty.html'">👨‍🏫 Faculty Members</li>
            <li class="active" onclick="location.href='profile.html'">👤 My Profile</li>
            <li onclick="location.href='setting.html'">⚙️ Setting</li>
            <li class="admin-only" style="display:none;" onclick="location.href='admin.html'">🔐 Admin Panel</li>
            <li class="logout-item" id="logoutBtn">🚪 Log out</li>
        </ul>
    </div>

    <div class="main-content">
        <div class="top-icons">
            <div class="hamburger" id="hamburgerBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </div>
            <div style="display: flex; gap: 20px; position: relative;">
                <div class="icon-btn" id="theme-toggle">🌙</div>
                <div class="icon-btn" id="notifBtn">
                    🔔<span class="badge" id="notifBadge"></span>
                </div>
                <div class="notif-dropdown" id="notifDropdown">
                    <h4 style="margin-bottom:10px; padding-bottom:10px; border-bottom:2px solid rgba(0,0,0,0.05);">Notifications</h4>
                    <div id="notifList">Loading notifications...</div>
                </div>
            </div>
        </div>

        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar-circle">👤</div>
                <div class="header-info">
                    <h1 id="display-name">Loading...</h1>
                    <p id="display-role">Loading Profile</p>
                </div>
            </div>

            <div class="info-grid">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="val-name" class="input-field field-fixed" readonly>
                </div>
                <div class="input-group">
                    <label>ID Number</label>
                    <input type="text" id="val-id" class="input-field field-fixed" readonly>
                </div>
                <div class="input-group student-specific">
                    <label>Session</label>
                    <input type="text" class="input-field field-fixed" value="Loading..." readonly>
                </div>
                <div class="input-group student-specific">
                    <label>Year & Semester</label>
                    <div class="semester-row">
                        <input type="text" class="input-field field-fixed" value="Loading..." readonly>
                        <input type="text" class="input-field field-fixed" value="Loading..." readonly>
                    </div>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email-input" class="input-field" disabled>
                </div>
                <div class="input-group">
                    <label>Contact Number</label>
                    <input type="text" id="phone-input" class="input-field" disabled>
                </div>
            </div>

            <div class="action-area">
                <p id="helper-text" style="font-size: 13px; opacity: 0.5; font-weight: 600;">* To update contact info, click the edit button</p>
                <button class="edit-btn" id="edit-action" onclick="toggleEdit()">✏️ Edit Profile</button>
            </div>
        </div>
    </div>

    <div id="toast">Message goes here</div>

   <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBj4d6Bcpwe6UYZIqmuhCW_HHzQmpm8bYY",
        authDomain: "edurate-74300.firebaseapp.com",
        projectId: "edurate-74300",
        storageBucket: "edurate-74300.firebasestorage.app",
        messagingSenderId: "616936292339",
        appId: "1:616936292339:web:61a50822fad7e71b6f1c86",
        measurementId: "G-JDF60JSMQT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUserId = "";
    
    // 🚀 Sidebar Security Check
    const rawRole = localStorage.getItem('userRole') || 'student';
    const userRole = String(rawRole).trim().toLowerCase();
    
    document.querySelectorAll('.student-only').forEach(el => {
        el.style.display = (userRole === 'student') ? 'flex' : 'none';
    });
    document.querySelectorAll('.admin-only').forEach(el => {
        el.style.display = (userRole === 'admin') ? 'flex' : 'none';
    });

    // ১. লগ-ইন করা ইউজারের ডাটা লোড করা
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUserId = user.uid;
            const docRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const userData = docSnap.data();
                displayUserData(userData);
            }
        } else {
            window.location.replace('index.html');
        }
    });

    function displayUserData(data) {
        const role = data.role.toLowerCase();
        
        // হেডার আপডেট
        document.getElementById('display-name').innerText = data.fullName;
        document.getElementById('display-role').innerText = role.charAt(0).toUpperCase() + role.slice(1) + " Profile";
        
        // ইনপুট ফিল্ড আপডেট
        document.getElementById('val-name').value = data.fullName;
        document.getElementById('val-id').value = data.studentId || data.staffId || "N/A";
        document.getElementById('email-input').value = data.realEmail || data.email;
        document.getElementById('phone-input').value = data.contact || "N/A";

        // স্টুডেন্ট স্পেসিফিক ডাটা
        const studentElements = document.querySelectorAll('.student-specific');
        if (role === 'student') {
            studentElements.forEach(el => el.style.display = 'block');
            document.querySelector('.semester-row input:nth-child(1)').value = data.year || "N/A";
            document.querySelector('.semester-row input:nth-child(2)').value = data.semester || "N/A";
            document.querySelector('.input-group.student-specific:nth-child(3) input').value = data.session || "N/A";
        } else {
            studentElements.forEach(el => el.style.display = 'none');
        }
    }

    // ২. প্রোফাইল এডিট ও সেভ লজিক
    let isEditing = false;
    window.toggleEdit = async () => {
        const emailInput = document.getElementById('email-input');
        const phoneInput = document.getElementById('phone-input');
        const btn = document.getElementById('edit-action');
        const helper = document.getElementById('helper-text');

        if (!isEditing) {
            isEditing = true;
            emailInput.disabled = false;
            phoneInput.disabled = false;
            btn.innerHTML = "💾 Save Changes";
            btn.classList.add('save-mode');
            helper.innerText = "* You can now change your Email and Phone Number";
            emailInput.focus();
        } else {
            try {
                const userRef = doc(db, "users", currentUserId);
                await updateDoc(userRef, {
                    realEmail: emailInput.value,
                    contact: phoneInput.value
                });

                isEditing = false;
                emailInput.disabled = true;
                phoneInput.disabled = true;
                btn.innerHTML = "✏️ Edit Profile";
                btn.classList.remove('save-mode');
                helper.innerText = "* To update contact info, click the edit button";
                showToast("Profile Updated Successfully! ✅");
            } catch (error) {
                showToast("Update Failed! ❌", true);
            }
        }
    };

    // --- থিম ও টোস্ট কোড ---
    const themeToggle = document.getElementById('theme-toggle');
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        themeToggle.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    });

    window.showToast = (msg, isError = false) => {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.background = isError ? 'var(--danger)' : 'var(--success)';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    };

    document.getElementById('hamburgerBtn').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
    });
    // 🚀 CLOSE SIDEBAR ON OUTSIDE CLICK (MOBILE VIEW FIX)
        document.addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebar');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            
            // Check if the sidebar is open and the click happened outside the sidebar and hamburger button
            if (sidebar && hamburgerBtn && sidebar.classList.contains('open')) {
                if (!sidebar.contains(e.target) && !hamburgerBtn.contains(e.target)) {
                    sidebar.classList.remove('open');
                }
            }
        });
    
    // 🚀 Logout Logic
    document.getElementById('logoutBtn').addEventListener('click', () => {
        signOut(auth).then(() => { localStorage.clear(); window.location.replace('index.html'); });
    });
    // ==========================================
        // GLOBAL REAL-TIME NOTIFICATION SYSTEM (WITH SEEN TRACKING)
        // ==========================================
        (function() {
            const notifBtn = document.getElementById('notifBtn');
            const notifDropdown = document.getElementById('notifDropdown');
            const notifBadge = document.getElementById('notifBadge');
            const notifList = document.getElementById('notifList');
            
            // Variable to track the latest notification timestamp
            let currentMaxTimestamp = 0; 

            // 1. Toggle dropdown visibility and hide the red badge
            if (notifBtn && notifDropdown) {
                notifBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    notifDropdown.classList.toggle('show');
                    if (notifBadge) notifBadge.style.display = 'none'; 
                    
                    // Save the latest timestamp to localStorage when dropdown is opened
                    if (currentMaxTimestamp > 0) {
                        localStorage.setItem('lastSeenNotifTime', currentMaxTimestamp.toString());
                    }
                });

                // 2. Close dropdown when clicking anywhere outside of it
                document.addEventListener('click', (e) => {
                    if (!notifBtn.contains(e.target) && !notifDropdown.contains(e.target)) {
                        notifDropdown.classList.remove('show');
                    }
                });
            }
            
            // 3. Fetch real-time notifications from Firestore
            if (notifList && typeof db !== 'undefined') {
                onSnapshot(collection(db, "notifications"), (snapshot) => {
                    if (snapshot.empty) {
                        notifList.innerHTML = '<div style="opacity:0.5; padding:10px; text-align:center;">No new notifications</div>';
                        return;
                    }

                    let notifsArray = [];
                    currentMaxTimestamp = 0; // Reset timestamp

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        notifsArray.push(data);
                        
                        // Find the maximum timestamp from the fetched notifications
                        if (data.timestamp > currentMaxTimestamp) {
                            currentMaxTimestamp = data.timestamp;
                        }
                    });
                    
                    // Sort array to display the most recent notification first
                    notifsArray.sort((a, b) => b.timestamp - a.timestamp);

                    notifList.innerHTML = '';
                    notifsArray.forEach(n => {
                        notifList.innerHTML += `
                            <div class="notif-item">
                                <span class="notif-date">${n.date}</span>
                                ${n.text}
                            </div>`;
                    });
                    
                    // Check the last seen timestamp stored in the browser
                    const lastSeen = parseInt(localStorage.getItem('lastSeenNotifTime')) || 0;

                    // Show the red dot ONLY if new data arrives (current timestamp > last seen)
                    if (currentMaxTimestamp > lastSeen && notifBadge && notifDropdown && !notifDropdown.classList.contains('show')) {
                        notifBadge.style.display = 'block'; 
                    } else if (notifBadge) {
                        notifBadge.style.display = 'none'; // Keep it hidden otherwise
                    }
                }, (error) => {
                    console.error("Error loading notifications: ", error);
                });
            }
        })();
</script>
</body>
</html>
